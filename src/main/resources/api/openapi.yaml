openapi: 3.1.0
info:
  title: GuestGraph Core API
  version: 1.3.0
  description: |-
    Tenant-scoped guest identity resolution: ingest source records, resolve identities, query golden profiles, explain and reverse merges, review uncertain matches. All errors are RFC 9457 problem details; auth is the per-tenant X-API-Key.

    Probabilistic matching: fuzzy candidates are scored and either auto-merged, queued for review, or discarded per tenant-configurable thresholds; per-tenant identifier quality rules govern how much an identifier may prove (including masked OTA relay emails); persistent do-not-merge rules keep steward splits from silently re-merging.

    Guest timeline: source business objects such as reservations become associations on the resolved guest. The newest object version's complete person roster determines who is currently on an object; persons are never matched across versions. Every decision records the actor that made it — the system, a named human steward, or a named agent.

    Retired guest ids resolve. A guest id that a merge absorbed or an unmerge emptied is never reused and never answers not-found: reading it names the guest or guests that hold the person now, with the chain of decisions in between, so a stored guest id stays a valid external reference across merges and splits.
  license:
    name: Apache-2.0
servers:
- url: /api/v1
security:
- ApiKey: [
    ]
tags:
- name: Source Systems
  description: Registry of the systems records are ingested from
- name: Ingestion
  description: Immutable record intake with synchronous identity resolution
- name: Guests
  description: Golden profiles, their source records, explainability, and unmerge
- name: Match Reviews
  description: Human decisions on uncertain matches
- name: Matching Config
  description: Per-tenant score thresholds for fuzzy matching
- name: Identifier Rules
  description: Per-tenant identifier trust (ignore, perfect-match, masked-alias)
- name: Negative Rules
  description: Persistent do-not-merge record pairs written by steward decisions
- name: Timeline
  description: A resolved guest's current business-object associations
- name: Source Objects
  description: A business object's current roster and full observation history
