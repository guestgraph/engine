components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Per-tenant API key; determines the tenant scope of every operation
  parameters:
    GuestId:
      name: guestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ActorId:
      name: X-Actor-Id
      in: header
      required: false
      schema:
        type: string
      description: |
        Names the individual acting behind a shared credential. Attribution only — it is caller-asserted, unverified, and authorises nothing. Defaults to the credential's own actor name.
    ActorType:
      name: X-Actor-Type
      in: header
      required: false
      schema:
        type: string
        enum:
        - HUMAN
        - AGENT
      description: |
        Must match what the credential is registered as, if sent at all. A mismatch is refused with an RFC 9457 400 and records nothing — the credential is the trust boundary, so a request can never claim a stronger actor type than it was issued.
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Retired:
      description: |
        The guest id was retired by a merge or a split. The problem details name the current guest or guests; read GET /guests/{guestId} on the retired id for the full resolution.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/RetiredGuestProblem'
  schemas:
    ProblemDetails:
      type: object
      description: RFC 9457
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
      additionalProperties: true
    IdentifierType:
      type: string
      enum:
      - EMAIL
      - PHONE
      - LOYALTY_ID
      - ID_DOCUMENT
      - EXTERNAL_KEY
    Identifier:
      type: object
      required:
      - type
      - value
      properties:
        type:
          $ref: '#/components/schemas/IdentifierType'
        value:
          type: string
          description: Normalized value; for ID_DOCUMENT this is the hash
    IngestRecord:
      type: object
      required:
      - sourceSystem
      - externalKey
      - payload
      properties:
        sourceSystem:
          type: string
          description: Code of a registered source system
          examples:
          - opera-pms
        externalKey:
          type: string
          description: |
            Identifies this OBSERVATION of the source record, not the underlying business object — dedup key together with sourceSystem. Records are immutable snapshots: when the source mutates an object over its lifecycle (e.g. the guest data on a PMS reservation is edited), each version must arrive with its own externalKey (reservation id + modification timestamp / version / event id), or the update is silently absorbed as DUPLICATE_IGNORED. Reuse the same externalKey only for idempotent redelivery of the identical version (webhook retries).
          examples:
          - RES-123:2026-07-09T14:30:00Z
        recordTimestamp:
          type:
          - string
          - 'null'
          format: date-time
          description: |
            When the source produced this version; drives survivorship (most recent non-null field wins), so later versions of the same object supersede earlier ones in the golden profile
        payload:
          type: object
          description: |
            The raw guest record. Recognized fields are extracted and normalized (firstName, lastName, email, phone, loyaltyId, idDocument{type,number}, plus arbitrary extra fields, all preserved verbatim).
          additionalProperties: true
    IngestResult:
      type: object
      required:
      - externalKey
      - status
      - needsReview
      properties:
        externalKey:
          type: string
        sourceRecordId:
          type:
          - string
          - 'null'
          format: uuid
        guestId:
          type:
          - string
          - 'null'
          format: uuid
        status:
          type: string
          enum:
          - CREATED_GUEST
          - ATTACHED
          - MERGED
          - DUPLICATE_IGNORED
          - ERROR
          description: |
            The resolution outcome. CREATED_GUEST: no match, new guest. ATTACHED: one match. MERGED: 2+ guests merged. DUPLICATE_IGNORED: same sourceSystem+externalKey already stored. ERROR: this record failed — problem carries details.
        needsReview:
          type: boolean
          description: |
            The record was stored but flagged (malformed values, no valid identifiers). Reported beside the status so neither masks the other.
        pendingReviewIds:
          type: array
          description: Suspicious matches parked in the review queue instead of merged
          items:
            type: string
            format: uuid
        problem:
          oneOf:
          - $ref: '#/components/schemas/ProblemDetails'
          - type: 'null'
    SourceSystem:
      type: object
      required:
      - id
      - code
      - name
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        createdAt:
          type: string
          format: date-time
    SourceRecord:
      type: object
      required:
      - id
      - sourceSystem
      - externalKey
      - payload
      - needsReview
      - receivedAt
      properties:
        id:
          type: string
          format: uuid
        sourceSystem:
          type: string
        externalKey:
          type: string
        payload:
          type: object
          additionalProperties: true
          description: The original, exactly as received
        identifiers:
          type: array
          items:
            $ref: '#/components/schemas/Identifier'
        recordTimestamp:
          type:
          - string
          - 'null'
          format: date-time
        needsReview:
          type: boolean
        needsReviewReasons:
          type: array
          items:
            type: string
        receivedAt:
          type: string
          format: date-time
    Guest:
      type: object
      required:
      - id
      - profile
      - identifiers
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - ACTIVE
          description: Added by feature 004; every guest document this API returns carries it.
        profile:
          type: object
          additionalProperties: true
          description: Golden profile — derived per survivorship rules, recomputable
        identifiers:
          type: array
          items:
            $ref: '#/components/schemas/Identifier'
        recordCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MergeEvent:
      type: object
      required:
      - id
      - kind
      - guestId
      - matcherName
      - confidence
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - CREATE
          - ATTACH
          - MERGE
          - UNMERGE
          - REVIEW_CONFIRM
          - REVIEW_REJECT
        guestId:
          type: string
          format: uuid
        absorbedGuestIds:
          type: array
          items:
            type: string
            format: uuid
        sourceRecordIds:
          type: array
          items:
            type: string
            format: uuid
        matcherName:
          type: string
          examples:
          - deterministic-identifier-v1
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: 1.0 for deterministic decisions
        evidence:
          type: object
          additionalProperties: true
          description: Matched identifiers and context — the human-readable "why"
        createdAt:
          type: string
          format: date-time
    MatchReview:
      type: object
      required:
      - id
      - status
      - sourceRecordId
      - candidateGuestId
      - reason
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - PENDING
          - CONFIRMED
          - REJECTED
        sourceRecordId:
          type: string
          format: uuid
        candidateGuestId:
          type: string
          format: uuid
        identifier:
          type: object
          description: |
            What connected the candidate. Since feature 002, type is an open string: exact-identifier types (EMAIL, PHONE, LOYALTY_ID, ID_DOCUMENT, EXTERNAL_KEY) or fuzzy blocking-key types (NAME_PHONETIC_BIRTHYEAR, NAME_INITIALS_BIRTHDATE, PHONE_SUFFIX7, EMAIL_LOCALPART, EMAIL_MASKED).
          properties:
            type:
              type: string
            value:
              type: string
        reason:
          type: string
          examples:
          - identifier shared by 41 records (threshold 10)
        matcherName:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        createdAt:
          type: string
          format: date-time
        decidedAt:
          type:
          - string
          - 'null'
          format: date-time
        decisionEventId:
          type:
          - string
          - 'null'
          format: uuid
    MatchingConfig:
      type: object
      required:
      - autoMergeThreshold
      - reviewFloor
      - reviewThreshold
      properties:
        autoMergeThreshold:
          type: number
          minimum: 0
          maximum: 1
          description: 'Fuzzy scores at/above merge automatically. Default 1.0: automation off'
        reviewFloor:
          type: number
          minimum: 0
          maximum: 1
          description: Fuzzy scores at/above (and below autoMergeThreshold) go to review; below are discarded
        reviewThreshold:
          type: integer
          minimum: 1
          description: Slice-1 identifier-sharing count above which exact matches are parked
    IdentifierRule:
      type: object
      required:
      - id
      - identifierType
      - matchKind
      - value
      - rule
      - builtin
      properties:
        id:
          type:
          - string
          - 'null'
          format: uuid
          description: Null for built-ins
        identifierType:
          type: string
        matchKind:
          type: string
          enum:
          - EXACT
          - EMAIL_DOMAIN
        value:
          type: string
        rule:
          type: string
          enum:
          - IGNORE
          - PERFECT_MATCH
          - MASKED_ALIAS
        note:
          type:
          - string
          - 'null'
        builtin:
          type: boolean
        createdAt:
          type:
          - string
          - 'null'
          format: date-time
    NegativeRule:
      type: object
      required:
      - id
      - recordA
      - recordB
      - origin
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        recordA:
          type: string
          format: uuid
        recordB:
          type: string
          format: uuid
        origin:
          type: string
          enum:
          - UNMERGE
          - REVIEW_REJECT
          - MANUAL
        createdAt:
          type: string
          format: date-time
        actor:
          type:
          - object
          - 'null'
          description: Who created the split. Null for rules predating actor identity.
          properties:
            type:
              type: string
              enum:
              - SYSTEM
              - HUMAN
              - AGENT
            id:
              type: string
        liftedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: When the rule stopped gating, or null while it still does.
        liftedActor:
          type:
          - object
          - 'null'
          description: Who lifted it.
          properties:
            type:
              type: string
              enum:
              - SYSTEM
              - HUMAN
              - AGENT
            id:
              type: string
    ObjectRole:
      type: string
      enum:
      - PRIMARY_GUEST
      - ADDITIONAL_GUEST
      - BOOKER
    Association:
      type: object
      required:
      - sourceSystem
      - objectType
      - objectId
      - role
      - status
      - observationCount
      - currentObservation
      properties:
        sourceSystem:
          type: string
        objectType:
          type: string
        objectId:
          type: string
        role:
          $ref: '#/components/schemas/ObjectRole'
        position:
          type:
          - integer
          - 'null'
          description: |
            The position the source listed this person at. Descriptive only — it carries no identity across versions, so a shifted position is not a reassignment.
        status:
          type: string
          enum:
          - CURRENT
          - ENDED
          description: |
            CURRENT while the object's newest roster places this guest in this role; ENDED once it no longer does, whether the role passed to someone else or the guest was dropped.
        successorGuestId:
          type:
          - string
          - 'null'
          format: uuid
          description: |
            For ENDED only, and only when exactly one guest holds this role in the current roster. Null when the role has no single successor — including when the guest was simply removed and nobody replaced them.
        businessStart:
          type:
          - string
          - 'null'
          format: date-time
        businessEnd:
          type:
          - string
          - 'null'
          format: date-time
        observationCount:
          type: integer
          description: Observations of this object and role across all versions and guests.
        currentObservation:
          $ref: '#/components/schemas/ObjectObservation'
    RosterEntry:
      type: object
      required:
      - role
      - guestId
      - sourceRecordId
      properties:
        role:
          $ref: '#/components/schemas/ObjectRole'
        position:
          type:
          - integer
          - 'null'
        guestId:
          type: string
          format: uuid
        sourceRecordId:
          type: string
          format: uuid
    ObjectObservation:
      type: object
      required:
      - sourceRecordId
      - objectVersion
      - role
      - guestId
      - recordTimestamp
      properties:
        sourceRecordId:
          type: string
          format: uuid
        objectVersion:
          type: string
          format: date-time
          description: The instant the source object recorded as its last modification.
        role:
          $ref: '#/components/schemas/ObjectRole'
        position:
          type:
          - integer
          - 'null'
        guestId:
          type: string
          format: uuid
          description: The guest this observation resolved to.
        extracted:
          type: object
          additionalProperties: true
          description: Normalized fields parsed from the payload at ingest.
        recordTimestamp:
          type: string
          format: date-time
        needsReview:
          type: boolean
    GuestStatus:
      type: string
      enum:
      - ACTIVE
      - MERGED
      - SPLIT
      - RETIRED
      description: |
        ACTIVE: the id names a guest. MERGED: the id was retired and exactly one guest holds the person now. SPLIT: the id was retired and several guests do. RETIRED: the id was retired and the walk found no current guest, which the audit trail does not allow and is reported rather than hidden.
    ActiveGuest:
      description: The guest document of feature 001 plus its status.
      allOf:
      - $ref: '#/components/schemas/Guest'
      - type: object
        required:
        - status
        properties:
          status:
            type: string
            enum:
            - ACTIVE
    GuestIdResolution:
      type: object
      required:
      - id
      - status
      - currentGuestIds
      - retiredAt
      - hops
      properties:
        id:
          type: string
          format: uuid
          description: The id that was read.
        status:
          type: string
          enum:
          - MERGED
          - SPLIT
          - RETIRED
        currentGuestIds:
          type: array
          items:
            type: string
            format: uuid
          description: |
            Every active guest the chain ends at, each once. One entry for MERGED, several for SPLIT, none for RETIRED.
        retiredAt:
          type: string
          format: date-time
          description: When the read id's own retirement was recorded.
        hops:
          type: array
          items:
            $ref: '#/components/schemas/ResolutionHop'
          description: Every retirement between the read id and the current guests, oldest first.
    ResolutionHop:
      type: object
      required:
      - retiredGuestId
      - kind
      - eventId
      - at
      - successorGuestIds
      properties:
        retiredGuestId:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - MERGE
          - SPLIT
          description: |
            MERGE for a merge or a confirmed review that absorbed the guest; SPLIT for an unmerge that detached every record and removed it.
        eventId:
          type: string
          format: uuid
          description: The merge event that retired the guest; it appears in the current guest's explain.
        at:
          type: string
          format: date-time
        successorGuestIds:
          type: array
          items:
            type: string
            format: uuid
          description: The survivor for MERGE; the guests the detached records landed on for SPLIT.
    RetiredGuestProblem:
      description: RFC 9457 problem details with extension members naming the current guests.
      type: object
      required:
      - type
      - title
      - status
      - guestId
      - currentGuestIds
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        guestId:
          type: string
          format: uuid
          description: The retired id that was addressed.
        resolutionStatus:
          type: string
          enum:
          - MERGED
          - SPLIT
          - RETIRED
        currentGuestIds:
          type: array
          items:
            type: string
            format: uuid
