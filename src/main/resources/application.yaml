# What is the engine's own; everything every guestgraph service shares comes from the vendored
# service-defaults.yaml, beneath this file and the environment.
spring:
  application:
    name: guestgraph

server:
  port: 8080

service:
  schema: engine
  # Request body cap on every path (RFC 9457 413 when exceeded): payloads are stored forever,
  # so the engine bounds them tighter than the default a service starts from.
  max-request-bytes: 5242880

guestgraph:
  # ISO region for national-format phone numbers (e.g. "CH"); unset = only
  # +international numbers are accepted as identifiers (research R5).
  default-phone-region: ""

---
# The local profile: the demo tenant and its key are seeded under it (LocalDevSeeder), so a
# developer runs the engine in one command and the quickstart's curl lines work as written.
spring:
  config:
    activate:
      on-profile: local
